                      - code [ref=f9e1296]: git | local
                    - cell "Source kind for a configured plugin marketplace. Marketplaces can be defined in system, cloud-managed, user, or trusted-project config.toml." [ref=f9e1297]
                  - row [ref=f9e1299]:
                    - cell [ref=f9e1300]:
                      - code [ref=f9e1301]: marketplaces.<name>.sparse_paths
                    - cell [ref=f9e1302]:
                      - code [ref=f9e1303]: array<string>
                    - cell "Optional sparse checkout paths for a Git marketplace. Include the marketplace catalog and any local plugin directories it references." [ref=f9e1304]
                  - row [ref=f9e1306]:
                    - cell [ref=f9e1307]:
                      - code [ref=f9e1308]: mcp_oauth_callback_port
                    - cell [ref=f9e1309]:
                      - code [ref=f9e1310]: integer
                    - cell [ref=f9e1311]:
                      - generic [ref=f9e1312]:
                        - text: Optional global fixed port for the local HTTP callback server used during MCP OAuth login. A server-specific
                        - code [ref=f9e1313]: oauth.callback_port
                        - text: takes precedence. When neither is set, Codex binds to an ephemeral port chosen by the OS.
                  - row [ref=f9e1314]:
                    - cell [ref=f9e1315]:
                      - code [ref=f9e1316]: mcp_oauth_callback_url
                    - cell [ref=f9e1317]:
                      - code [ref=f9e1318]: string
                    - cell "Optional base callback URL for MCP OAuth login, such as a devbox ingress URL. Newly added pre-registered clients use this URL unchanged when the authorization server supports issuer identification; existing clients without a saved callback append a server-specific callback ID. Without issuer support, any pre-registered MCP server whose configured callback lacks the required ID falls back to this URL with the ID appended. Callback URL ports don't select the listener port." [ref=f9e1319]
                  - row [ref=f9e1321]:
                    - cell [ref=f9e1322]:
                      - code [ref=f9e1323]: mcp_oauth_credentials_store
                    - cell [ref=f9e1324]:
                      - code [ref=f9e1325]: auto | file | keyring
                    - cell "Preferred store for MCP OAuth credentials." [ref=f9e1326]
                  - row [ref=f9e1328]:
                    - cell [ref=f9e1329]:
                      - code [ref=f9e1330]: mcp_optional_startup_grace_ms
                    - cell [ref=f9e1331]:
                      - code [ref=f9e1332]: integer (milliseconds)
                    - cell [ref=f9e1333]:
                      - generic [ref=f9e1334]:
                        - text: Shared wait for optional MCP servers when building the initial tool catalog. Defaults to
                        - code [ref=f9e1335]: "1000"
                        - text: . Set to
                        - code [ref=f9e1336]: "0"
                        - text: to wait for each server's
                        - code [ref=f9e1337]: startup_timeout_sec
                        - text: instead.
                  - row [ref=f9e1338]:
                    - cell [ref=f9e1339]:
                      - code [ref=f9e1340]: mcp_servers.<id>.args
                    - cell [ref=f9e1341]:
                      - code [ref=f9e1342]: array<string>
                    - cell "Arguments passed to the MCP stdio server command." [ref=f9e1343]
                  - row [ref=f9e1345]:
                    - cell [ref=f9e1346]:
                      - code [ref=f9e1347]: mcp_servers.<id>.auth
                    - cell [ref=f9e1348]:
                      - code [ref=f9e1349]: oauth | chatgpt
                    - cell [ref=f9e1350]:
                      - generic [ref=f9e1351]:
                        - text: Authentication fallback for an MCP HTTP server after configured bearer tokens and authorization headers.
                        - code [ref=f9e1352]: oauth
                        - text: (default) uses stored MCP OAuth credentials when available.
                        - code [ref=f9e1353]: chatgpt
                        - text: uses the current ChatGPT session for the trusted first-party ChatGPT origin, then falls back to stored OAuth. Both modes can connect without authentication if no credential source resolves.
                  - row [ref=f9e1354]:
                    - cell [ref=f9e1355]:
                      - code [ref=f9e1356]: mcp_servers.<id>.bearer_token_env_var
                    - cell [ref=f9e1357]:
                      - code [ref=f9e1358]: string
                    - cell "Environment variable sourcing the bearer token for an MCP HTTP server." [ref=f9e1359]
                  - row [ref=f9e1361]:
                    - cell [ref=f9e1362]:
                      - code [ref=f9e1363]: mcp_servers.<id>.command
                    - cell [ref=f9e1364]:
                      - code [ref=f9e1365]: string
                    - cell "Launcher command for an MCP stdio server." [ref=f9e1366]
                  - row [ref=f9e1368]:
                    - cell [ref=f9e1369]:
                      - code [ref=f9e1370]: mcp_servers.<id>.cwd
                    - cell [ref=f9e1371]:
                      - code [ref=f9e1372]: string
                    - cell "Working directory for the MCP stdio server process." [ref=f9e1373]
                  - row [ref=f9e1375]:
                    - cell [ref=f9e1376]:
                      - code [ref=f9e1377]: mcp_servers.<id>.default_tools_approval_mode
                    - cell [ref=f9e1378]:
                      - code [ref=f9e1379]: auto | prompt | writes | approve
                    - cell "Default approval behavior for MCP tools on this server unless a per-tool override exists." [ref=f9e1380]
                  - row [ref=f9e1382]:
                    - cell [ref=f9e1383]:
                      - code [ref=f9e1384]: mcp_servers.<id>.disabled_tools
                    - cell [ref=f9e1385]:
                      - code [ref=f9e1386]: array<string>
                    - cell [ref=f9e1387]:
                      - generic [ref=f9e1388]:
                        - text: Deny list applied after
                        - code [ref=f9e1389]: enabled_tools
                        - text: for the MCP server.
                  - row [ref=f9e1390]:
                    - cell [ref=f9e1391]:
                      - code [ref=f9e1392]: mcp_servers.<id>.enabled
                    - cell [ref=f9e1393]:
                      - code [ref=f9e1394]: boolean
                    - cell "Disable an MCP server without removing its configuration." [ref=f9e1395]
                  - row [ref=f9e1397]:
                    - cell [ref=f9e1398]:
                      - code [ref=f9e1399]: mcp_servers.<id>.enabled_tools
                    - cell [ref=f9e1400]:
                      - code [ref=f9e1401]: array<string>
                    - cell "Allow list of tool names exposed by the MCP server." [ref=f9e1402]
                  - row [ref=f9e1404]:
                    - cell [ref=f9e1405]:
                      - code [ref=f9e1406]: mcp_servers.<id>.env
                    - cell [ref=f9e1407]:
                      - code [ref=f9e1408]: map<string,string>
                    - cell "Environment variables forwarded to the MCP stdio server." [ref=f9e1409]
                  - row [ref=f9e1411]:
                    - cell [ref=f9e1412]:
                      - code [ref=f9e1413]: mcp_servers.<id>.env_http_headers
                    - cell [ref=f9e1414]:
                      - code [ref=f9e1415]: map<string,string>
                    - cell "HTTP headers populated from environment variables for an MCP HTTP server." [ref=f9e1416]
                  - row [ref=f9e1418]:
                    - cell [ref=f9e1419]:
                      - code [ref=f9e1420]: mcp_servers.<id>.env_vars
                    - cell [ref=f9e1421]:
                      - code [ref=f9e1422]: "array<string | { name = string, source = \"local\" | \"remote\" }>"
                    - cell [ref=f9e1423]:
                      - generic [ref=f9e1424]:
                        - text: Additional environment variables to whitelist for an MCP stdio server. String entries default to
                        - code [ref=f9e1425]: source = "local"
                        - text: ; use
                        - code [ref=f9e1426]: source = "remote"
                        - text: only with executor-backed remote stdio.
                  - row [ref=f9e1427]:
                    - cell [ref=f9e1428]:
                      - code [ref=f9e1429]: mcp_servers.<id>.experimental_environment
                    - cell [ref=f9e1430]:
                      - code [ref=f9e1431]: local | remote
                    - cell [ref=f9e1432]:
                      - generic [ref=f9e1433]:
                        - text: Experimental placement for an MCP server.
                        - code [ref=f9e1434]: remote
                        - text: starts stdio servers through a remote executor environment; streamable HTTP remote placement is not implemented.
                  - row [ref=f9e1435]:
                    - cell [ref=f9e1436]:
                      - code [ref=f9e1437]: mcp_servers.<id>.http_headers
                    - cell [ref=f9e1438]:
                      - code [ref=f9e1439]: map<string,string>
                    - cell "Static HTTP headers included with each MCP HTTP request." [ref=f9e1440]
                  - row [ref=f9e1442]:
                    - cell [ref=f9e1443]:
                      - code [ref=f9e1444]: mcp_servers.<id>.http_headers_helper
                    - cell [ref=f9e1445]:
                      - code [ref=f9e1446]: string (command)
                    - cell "Local command that prints a JSON object of HTTP header names and values. Supported only for locally connected HTTP MCP servers. Explicit bearer tokens and OAuth credentials take precedence over helper-provided Authorization headers." [ref=f9e1447]
                  - row [ref=f9e1449]:
                    - cell [ref=f9e1450]:
                      - code [ref=f9e1451]: mcp_servers.<id>.oauth_resource
                    - cell [ref=f9e1452]:
                      - code [ref=f9e1453]: string
                    - cell "Optional RFC 8707 OAuth resource parameter to include during MCP login." [ref=f9e1454]
                  - row [ref=f9e1456]:
                    - cell [ref=f9e1457]:
                      - code [ref=f9e1458]: mcp_servers.<id>.oauth.callback_port
                    - cell [ref=f9e1459]:
                      - code [ref=f9e1460]: integer
                    - cell [ref=f9e1461]:
                      - generic [ref=f9e1462]:
                        - text: Fixed OAuth callback listener port for this MCP server. Overrides
                        - code [ref=f9e1463]: mcp_oauth_callback_port
                        - text: . For a direct loopback callback with an explicit URL port, configure the same listener port.
                  - row [ref=f9e1464]:
                    - cell [ref=f9e1465]:
                      - code [ref=f9e1466]: mcp_servers.<id>.oauth.callback_url
                    - cell [ref=f9e1467]:
                      - code [ref=f9e1468]: string
                    - cell "Server-specific OAuth callback. Pre-registered clients reuse it when issuer identification is supported or the URL already ends in the server-specific callback ID. Otherwise, Codex uses the global or default callback with that ID appended. Clients without a pre-registered ID use this callback during client registration." [ref=f9e1469]
                  - row [ref=f9e1471]:
                    - cell [ref=f9e1472]:
                      - code [ref=f9e1473]: mcp_servers.<id>.oauth.client_id
                    - cell [ref=f9e1474]:
                      - code [ref=f9e1475]: string
                    - cell "Pre-registered OAuth client ID used for authorization and token exchange with this MCP server." [ref=f9e1476]
                  - row [ref=f9e1478]:
                    - cell [ref=f9e1479]:
                      - code [ref=f9e1480]: mcp_servers.<id>.required
                    - cell [ref=f9e1481]:
                      - code [ref=f9e1482]: boolean
                    - cell "When true, fail startup/resume if this enabled MCP server cannot initialize." [ref=f9e1483]
                  - row [ref=f9e1485]:
                    - cell [ref=f9e1486]:
                      - code [ref=f9e1487]: mcp_servers.<id>.scopes
                    - cell [ref=f9e1488]:
                      - code [ref=f9e1489]: array<string>
                    - cell "OAuth scopes to request when authenticating to that MCP server." [ref=f9e1490]
                  - row [ref=f9e1492]:
                    - cell [ref=f9e1493]:
                      - code [ref=f9e1494]: mcp_servers.<id>.startup_timeout_ms
                    - cell [ref=f9e1495]:
                      - code [ref=f9e1496]: number
                    - cell [ref=f9e1497]:
                      - generic [ref=f9e1498]:
                        - text: Alias for
                        - code [ref=f9e1499]: startup_timeout_sec
                        - text: in milliseconds.
                  - row [ref=f9e1500]:
                    - cell [ref=f9e1501]:
                      - code [ref=f9e1502]: mcp_servers.<id>.startup_timeout_sec
                    - cell [ref=f9e1503]:
                      - code [ref=f9e1504]: number
                    - cell "Override the default 10s startup timeout for an MCP server." [ref=f9e1505]
                  - row [ref=f9e1507]:
                    - cell [ref=f9e1508]:
                      - code [ref=f9e1509]: mcp_servers.<id>.tool_timeout_sec
                    - cell [ref=f9e1510]:
                      - code [ref=f9e1511]: number
                    - cell "Override the default 60s per-tool timeout for an MCP server." [ref=f9e1512]
                  - row [ref=f9e1514]:
                    - cell [ref=f9e1515]:
                      - code [ref=f9e1516]: mcp_servers.<id>.tools.<tool>.approval_mode
                    - cell [ref=f9e1517]:
                      - code [ref=f9e1518]: auto | prompt | writes | approve
                    - cell "Per-tool approval behavior override for one MCP tool on this server." [ref=f9e1519]
                  - row [ref=f9e1521]:
                    - cell [ref=f9e1522]:
                      - code [ref=f9e1523]: mcp_servers.<id>.tools.<tool>.output_token_limit
                    - cell [ref=f9e1524]:
                      - code [ref=f9e1525]: integer (positive)
                    - cell "Token budget for one MCP tool's output, before the standard 20% serialization allowance. Overrides the model's default output truncation budget for that tool." [ref=f9e1526]
                  - row [ref=f9e1528]:
                    - cell [ref=f9e1529]:
                      - code [ref=f9e1530]: mcp_servers.<id>.url
                    - cell [ref=f9e1531]:
                      - code [ref=f9e1532]: string
                    - cell "Endpoint for an MCP streamable HTTP server." [ref=f9e1533]
                  - row [ref=f9e1535]:
                    - cell [ref=f9e1536]:
                      - code [ref=f9e1537]: memories.consolidation_model
                    - cell [ref=f9e1538]:
                      - code [ref=f9e1539]: string
                    - cell "Optional model override for global memory consolidation." [ref=f9e1540]
                  - row [ref=f9e1542]:
                    - cell [ref=f9e1543]:
                      - code [ref=f9e1544]: memories.disable_on_external_context
                    - cell [ref=f9e1545]:
                      - code [ref=f9e1546]: boolean
                    - cell [ref=f9e1547]:
                      - generic [ref=f9e1548]:
                        - text: When
                        - code [ref=f9e1549]: "true"
                        - text: ", threads that use external context such as MCP tool calls, web search, or tool search are kept out of memory generation. Defaults to"
                        - code [ref=f9e1550]: "false"
                        - text: ". Legacy alias:"
                        - code [ref=f9e1551]: memories.no_memories_if_mcp_or_web_search
                        - text: .
                  - row [ref=f9e1552]:
                    - cell [ref=f9e1553]:
                      - code [ref=f9e1554]: memories.extract_model
                    - cell [ref=f9e1555]:
                      - code [ref=f9e1556]: string
                    - cell "Optional model override for per-thread memory extraction." [ref=f9e1557]
                  - row [ref=f9e1559]:
                    - cell [ref=f9e1560]:
                      - code [ref=f9e1561]: memories.generate_memories
                    - cell [ref=f9e1562]:
                      - code [ref=f9e1563]: boolean
                    - cell [ref=f9e1564]:
                      - generic [ref=f9e1565]:
                        - text: When
                        - code [ref=f9e1566]: "false"
                        - text: ", newly created threads are not stored as memory-generation inputs. Defaults to"
                        - code [ref=f9e1567]: "true"
                        - text: .
                  - row [ref=f9e1568]:
                    - cell [ref=f9e1569]:
                      - code [ref=f9e1570]: memories.max_raw_memories_for_consolidation
                    - cell [ref=f9e1571]:
                      - code [ref=f9e1572]: number
                    - cell [ref=f9e1573]:
                      - generic [ref=f9e1574]:
                        - text: Maximum recent raw memories retained for global consolidation. Defaults to
                        - code [ref=f9e1575]: "256"
                        - text: and is capped at
                        - code [ref=f9e1576]: "4096"
                        - text: .
                  - row [ref=f9e1577]:
                    - cell [ref=f9e1578]:
                      - code [ref=f9e1579]: memories.max_rollout_age_days
                    - cell [ref=f9e1580]:
                      - code [ref=f9e1581]: number
                    - cell [ref=f9e1582]:
                      - generic [ref=f9e1583]:
                        - text: Maximum age of threads considered for memory generation. Defaults to
                        - code [ref=f9e1584]: "30"
                        - text: and is clamped to
                        - code [ref=f9e1585]: "0"
                        - text: "-"
                        - code [ref=f9e1586]: "90"
                        - text: .
                  - row [ref=f9e1587]:
                    - cell [ref=f9e1588]:
                      - code [ref=f9e1589]: memories.max_rollouts_per_startup
                    - cell [ref=f9e1590]:
                      - code [ref=f9e1591]: number
                    - cell [ref=f9e1592]:
                      - generic [ref=f9e1593]:
                        - text: Maximum rollout candidates processed per startup pass. Defaults to
                        - code [ref=f9e1594]: "16"
                        - text: and is capped at
                        - code [ref=f9e1595]: "128"
                        - text: .
                  - row [ref=f9e1596]:
                    - cell [ref=f9e1597]:
                      - code [ref=f9e1598]: memories.max_unused_days
                    - cell [ref=f9e1599]:
                      - code [ref=f9e1600]: number
                    - cell [ref=f9e1601]:
                      - generic [ref=f9e1602]:
                        - text: Maximum days since a memory was last used before it becomes ineligible for consolidation. Defaults to
                        - code [ref=f9e1603]: "30"
                        - text: and is clamped to
                        - code [ref=f9e1604]: "0"
                        - text: "-"
                        - code [ref=f9e1605]: "365"
                        - text: .
                  - row [ref=f9e1606]:
                    - cell [ref=f9e1607]:
                      - code [ref=f9e1608]: memories.min_rate_limit_remaining_percent
                    - cell [ref=f9e1609]:
                      - code [ref=f9e1610]: number
                    - cell [ref=f9e1611]:
                      - generic [ref=f9e1612]:
                        - text: Minimum remaining percentage required in Codex rate-limit windows before memory generation starts. Defaults to
                        - code [ref=f9e1613]: "25"
                        - text: and is clamped to
                        - code [ref=f9e1614]: "0"
                        - text: "-"
                        - code [ref=f9e1615]: "100"
                        - text: .
                  - row [ref=f9e1616]:
                    - cell [ref=f9e1617]:
                      - code [ref=f9e1618]: memories.min_rollout_idle_hours
                    - cell [ref=f9e1619]:
                      - code [ref=f9e1620]: number
                    - cell [ref=f9e1621]:
                      - generic [ref=f9e1622]:
                        - text: Minimum idle time before a thread is considered for memory generation. Defaults to
                        - code [ref=f9e1623]: "6"
                        - text: and is clamped to
                        - code [ref=f9e1624]: "1"
                        - text: "-"
                        - code [ref=f9e1625]: "48"
                        - text: .
                  - row [ref=f9e1626]:
                    - cell [ref=f9e1627]:
                      - code [ref=f9e1628]: memories.use_memories
                    - cell [ref=f9e1629]:
                      - code [ref=f9e1630]: boolean
                    - cell [ref=f9e1631]:
                      - generic [ref=f9e1632]:
                        - text: When
                        - code [ref=f9e1633]: "false"
                        - text: ", Codex skips injecting existing memories into future sessions. Defaults to"
                        - code [ref=f9e1634]: "true"
                        - text: .
                  - row [ref=f9e1635]:
                    - cell [ref=f9e1636]:
                      - code [ref=f9e1637]: model
                    - cell [ref=f9e1638]:
                      - code [ref=f9e1639]: string
                    - cell [ref=f9e1640]:
                      - generic [ref=f9e1641]:
                        - text: Model to use (e.g.,
                        - code [ref=f9e1642]: gpt-6.1-sol
                        - text: ).
                  - row [ref=f9e1643]:
                    - cell [ref=f9e1644]:
                      - code [ref=f9e1645]: model_auto_compact_token_limit
                    - cell [ref=f9e1646]:
                      - code [ref=f9e1647]: number
                    - cell "Token threshold that triggers automatic history compaction (unset uses model defaults)." [ref=f9e1648]
                  - row [ref=f9e1650]:
                    - cell [ref=f9e1651]:
                      - code [ref=f9e1652]: model_auto_compact_token_limit_scope
                    - cell [ref=f9e1653]:
                      - code [ref=f9e1654]: total | body_after_prefix
                    - cell [ref=f9e1655]:
                      - generic [ref=f9e1656]:
                        - text: Controls whether the auto-compaction threshold counts the full active context (
                        - code [ref=f9e1657]: total
                        - text: ", the default) or only growth after the carried compaction-window prefix ("
                        - code [ref=f9e1658]: body_after_prefix
                        - text: ).
                  - row [ref=f9e1659]:
                    - cell [ref=f9e1660]:
                      - code [ref=f9e1661]: model_catalog_json
                    - cell [ref=f9e1662]:
                      - code [ref=f9e1663]: string (path)
                    - cell [ref=f9e1664]:
                      - generic [ref=f9e1665]:
                        - text: Optional path to a JSON model catalog loaded on startup. A selected
                        - code [ref=f9e1666]: $CODEX_HOME/profile-name.config.toml
                        - text: profile file can override this per profile.
                  - row [ref=f9e1667]:
                    - cell [ref=f9e1668]:
                      - code [ref=f9e1669]: model_context_window
                    - cell [ref=f9e1670]:
                      - code [ref=f9e1671]: number
                    - cell "Context window tokens available to the active model." [ref=f9e1672]
                  - row [ref=f9e1674]:
                    - cell [ref=f9e1675]:
                      - code [ref=f9e1676]: model_instructions_file
                    - cell [ref=f9e1677]:
                      - code [ref=f9e1678]: string (path)
                    - cell [ref=f9e1679]:
                      - generic [ref=f9e1680]:
                        - text: Replacement for built-in instructions instead of
                        - code [ref=f9e1681]: AGENTS.md
                        - text: .
                  - row [ref=f9e1682]:
                    - cell [ref=f9e1683]:
                      - code [ref=f9e1684]: model_provider
                    - cell [ref=f9e1685]:
                      - code [ref=f9e1686]: string
                    - cell [ref=f9e1687]:
                      - generic [ref=f9e1688]:
                        - text: Provider id from
                        - code [ref=f9e1689]: model_providers
                        - text: "(default:"
                        - code [ref=f9e1690]: openai
                        - text: ).
                  - row [ref=f9e1691]:
                    - cell [ref=f9e1692]:
                      - code [ref=f9e1693]: model_providers.<id>
                    - cell [ref=f9e1694]:
                      - code [ref=f9e1695]: table
                    - cell [ref=f9e1696]:
                      - generic [ref=f9e1697]:
                        - text: Custom provider definition. Built-in provider IDs (
                        - code [ref=f9e1698]: openai
                        - text: ","
                        - code [ref=f9e1699]: ollama
                        - text: ", and"
                        - code [ref=f9e1700]: lmstudio
                        - text: ) are reserved and cannot be overridden.
                  - row [ref=f9e1701]:
                    - cell [ref=f9e1702]:
                      - code [ref=f9e1703]: model_providers.<id>.auth
                    - cell [ref=f9e1704]:
                      - code [ref=f9e1705]: table
                    - cell [ref=f9e1706]:
                      - generic [ref=f9e1707]:
                        - text: Command-backed bearer token configuration for a custom provider. Do not combine with
                        - code [ref=f9e1708]: env_key
                        - text: ","
                        - code [ref=f9e1709]: experimental_bearer_token
                        - text: ", or"
                        - code [ref=f9e1710]: requires_openai_auth
                        - text: .
                  - row [ref=f9e1711]:
                    - cell [ref=f9e1712]:
                      - code [ref=f9e1713]: model_providers.<id>.auth.args
                    - cell [ref=f9e1714]:
                      - code [ref=f9e1715]: array<string>
                    - cell "Arguments passed to the token command." [ref=f9e1716]
                  - row [ref=f9e1718]:
                    - cell [ref=f9e1719]:
                      - code [ref=f9e1720]: model_providers.<id>.auth.command
                    - cell [ref=f9e1721]:
                      - code [ref=f9e1722]: string
                    - cell "Command to run when Codex needs a bearer token. The command must print the token to stdout." [ref=f9e1723]
                  - row [ref=f9e1725]:
                    - cell [ref=f9e1726]:
                      - code [ref=f9e1727]: model_providers.<id>.auth.cwd
