                    - cell [ref=f9e930]:
                      - generic [ref=f9e931]:
                        - text: Start the network proxy for sandboxed commands (experimental; off by default). Required to enforce permission-profile domain rules unless enabled administrator-managed
                        - code [ref=f9e932]: experimental_network
