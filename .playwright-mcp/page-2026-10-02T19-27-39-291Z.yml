                  - row [ref=f9e3062]:
                    - cell [ref=f9e3063]:
                      - code [ref=f9e3064]: browser_use.default_origin_policy.persistent_approval
                    - cell [ref=f9e3065]:
                      - code [ref=f9e3066]: boolean
