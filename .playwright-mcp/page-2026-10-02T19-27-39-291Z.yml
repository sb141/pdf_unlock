          - paragraph [ref=f9e2729]:
            - text: You can find the latest JSON schema for
            - code [ref=f9e2730]: config.toml
            - link "here" [ref=f9e2731] [cursor=pointer]:
              - /url: /docs/config-schema.json
            - text: .
          - paragraph [ref=f9e2732]:
            - text: To get autocompletion and diagnostics when editing
            - code [ref=f9e2733]: config.toml
            - text: in VS Code or Cursor, you can install the
            - link "Even Better TOML" [ref=f9e2734] [cursor=pointer]:
              - /url: https://marketplace.visualstudio.com/items?itemName=tamasfe.even-better-toml
            - text: extension and add this line to the top of your
            - code [ref=f9e2735]: config.toml
            - text: ":"
          - generic [ref=f9e2736]:
            - code [ref=f9e2737]:
              - generic [ref=f9e2738]: "#:schema https://developers.openai.com/codex/config-schema.json"
            - generic [ref=f9e2739]:
              - button "Copy code to clipboard" [ref=f9e2740] [cursor=pointer]
              - status [ref=f9e2743]
          - paragraph [ref=f9e2744]:
            - text: "Note: Rename"
            - code [ref=f9e2745]: experimental_instructions_file
            - text: to
            - code [ref=f9e2746]: model_instructions_file
            - text: . Codex deprecates the old key; update existing configs to the new name.
          - heading [level=2] [ref=f9e2747]:
            - code [ref=f9e2749]: requirements.toml
            - button "Copy link to requirements.toml" [ref=f9e2750] [cursor=pointer]
          - paragraph [ref=f9e2753]:
            - code [ref=f9e2754]: requirements.toml
            - text: is an admin-enforced configuration file that constrains security-sensitive settings users can’t override. For details, locations, and examples, see
            - link "Admin-enforced requirements" [ref=f9e2755] [cursor=pointer]:
              - /url: /docs/enterprise/managed-configuration#admin-enforced-requirements-requirementstoml
            - text: .
          - paragraph [ref=f9e2756]: For ChatGPT Business and Enterprise users, Codex can also apply cloud-fetched requirements. See the security page for precedence details.
          - paragraph [ref=f9e2757]:
            - text: Use
            - code [ref=f9e2758]: "[features]"
            - text: in
            - code [ref=f9e2759]: requirements.toml
            - text: to pin runtime feature flags by the same canonical keys that
            - code [ref=f9e2760]: config.toml
            - text: uses. Requirements can also include documented app-only keys that don’t belong in
            - code [ref=f9e2761]: config.toml
            - text: . Omitted keys remain unconstrained.
          - paragraph [ref=f9e2762]: Some managed requirements enforce an exact configuration value instead of an allowlist. Users can’t override an enforced path, update preference, login-shell policy, feedback setting, or Windows private-desktop setting.
          - paragraph [ref=f9e2763]:
            - text: Managed permission-profile allowlists require Codex 0.138.0 or later. Codex 0.137.0 and earlier ignore
            - code [ref=f9e2764]: allowed_permission_profiles
            - text: and managed
            - code [ref=f9e2765]: default_permissions
            - text: .
          - paragraph [ref=f9e2766]:
            - text: Use
            - code [ref=f9e2767]: allowed_sandbox_modes
            - text: with
            - code [ref=f9e2768]: sandbox_mode
            - text: . For permission-profile deployments, use
            - code [ref=f9e2769]: allowed_permission_profiles
            - text: with managed
            - code [ref=f9e2770]: default_permissions
            - text: .
          - paragraph [ref=f9e2771]:
            - text: An
            - code [ref=f9e2772]: untrusted
            - text: entry in
            - code [ref=f9e2773]: allowed_approval_policies
            - text: is still valid for the stricter approval behavior Codex derives when a project uses
            - code [ref=f9e2774]: trust_level = "untrusted"
            - text: . It does not permit explicitly setting
            - code [ref=f9e2775]: approval_policy = "untrusted"
            - text: .
          - paragraph [ref=f9e2776]:
            - text: The
            - code [ref=f9e2777]: "[models.new_thread]"
            - text: table supplies managed defaults, not enforcement. If you explicitly override the model or reasoning effort with
            - code [ref=f9e2778]: "--model"
            - text: ","
            - code [ref=f9e2779]: "--config"
            - text: ", or"
            - code [ref=f9e2780]: "--profile"
            - text: ", Codex ignores both"
            - code [ref=f9e2781]: model
            - text: and
            - code [ref=f9e2782]: model_reasoning_effort
            - text: in
            - code [ref=f9e2783]: "[models.new_thread]"
            - text: .
            - code [ref=f9e2784]: service_tier
            - text: is independent.
          - paragraph [ref=f9e2785]:
            - text: The browser requirements cover three separate surfaces.
            - code [ref=f9e2786]: in_app_browser
            - text: controls the browser pane that a person opens and uses directly.
            - code [ref=f9e2787]: browser_use
            - text: controls agent-driven work in a browser.
            - code [ref=f9e2788]: computer_use
            - text: controls agent-driven work in native desktop apps.
          - paragraph [ref=f9e2789]:
            - text: The nested Browser Use and Computer Use policy values do not grant access by themselves. An origin- or app-specific
            - code [ref=f9e2790]: allow
            - text: can override the fallback for the same policy source, but normal feature, approval, and other policy checks still apply. Where managed requirements and
            - code [ref=f9e2791]: config.toml
            - text: both apply, a
            - code [ref=f9e2792]: deny
            - text: from either one wins.
