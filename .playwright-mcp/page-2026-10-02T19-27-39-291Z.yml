            - text: for the global baseline and precedence.
          - heading [level=2] [ref=f9e314]:
            - code [ref=f9e316]: config.toml
            - button "Copy link to config.toml" [ref=f9e317] [cursor=pointer]
          - paragraph [ref=f9e320]:
            - text: User-level configuration lives in
            - code [ref=f9e321]: ~/.codex/config.toml
            - text: . You can also add project-scoped overrides in
            - code [ref=f9e322]: .codex/config.toml
            - text: files. Codex loads project-scoped config files only when you trust the project.
          - paragraph [ref=f9e323]:
            - text: Project-scoped config can’t override machine-local provider, auth, host-owned app request metadata, notification, configuration profile selection, or telemetry routing keys. Codex ignores
            - code [ref=f9e324]: openai_base_url
            - text: ","
