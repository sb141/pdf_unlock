                      - code [ref=f9e3161]: browser_use.origins.<pattern>.full_cdp_access
                    - cell [ref=f9e3162]:
                      - code [ref=f9e3163]: allow | deny
                    - cell [ref=f9e3164]:
                      - generic [ref=f9e3165]:
                        - text: Use
                        - code [ref=f9e3166]: deny
                        - text: to block full Chrome DevTools Protocol (CDP) access on matching origins.
                        - code [ref=f9e3167]: allow
                        - text: only lets normal opt-in and approval checks continue.
                  - row [ref=f9e3168]:
                    - cell [ref=f9e3169]:
                      - code [ref=f9e3170]: browser_use.origins.<pattern>.persistent_approval
                    - cell [ref=f9e3171]:
                      - code [ref=f9e3172]: boolean
                    - cell [ref=f9e3173]:
                      - generic [ref=f9e3174]:
                        - text: Set to
                        - code [ref=f9e3175]: "false"
                        - text: to prevent Browser Use from saving or honoring an
                        - code [ref=f9e3176]: Always allow
                        - text: approval on matching origins. Approvals for the current turn or thread can still apply.
                        - code [ref=f9e3177]: "true"
                        - text: makes
                        - code [ref=f9e3178]: Always allow
                        - text: available when otherwise permitted but does not create an approval.
                  - row [ref=f9e3179]:
                    - cell [ref=f9e3180]:
                      - code [ref=f9e3181]: browser_use.origins.<pattern>.uploads
                    - cell [ref=f9e3182]:
                      - code [ref=f9e3183]: allow | deny
                    - cell [ref=f9e3184]:
                      - generic [ref=f9e3185]:
