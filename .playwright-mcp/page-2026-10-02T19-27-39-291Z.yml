                  - row [ref=f9e1196]:
                    - cell [ref=f9e1197]:
                      - code [ref=f9e1198]: hooks
                    - cell [ref=f9e1199]:
                      - code [ref=f9e1200]: table
                    - cell [ref=f9e1201]:
                      - generic [ref=f9e1202]:
                        - text: Lifecycle hooks configured inline in
                        - code [ref=f9e1203]: config.toml
                        - text: . Uses the same event schema as
                        - code [ref=f9e1204]: hooks.json
                        - text: ; see the Hooks guide for examples and supported events.
                  - row [ref=f9e1205]:
                    - cell [ref=f9e1206]:
                      - code [ref=f9e1207]: hooks.<Event>
                    - cell [ref=f9e1208]:
                      - code [ref=f9e1209]: array<table>
                    - cell [ref=f9e1210]:
                      - generic [ref=f9e1211]:
                        - text: Matcher groups for hook events such as
                        - code [ref=f9e1212]: PreToolUse
                        - text: ","
                        - code [ref=f9e1213]: PermissionRequest
                        - text: ","
                        - code [ref=f9e1214]: PostToolUse
                        - text: ","
                        - code [ref=f9e1215]: PreCompact
                        - text: ","
                        - code [ref=f9e1216]: PostCompact
                        - text: ","
                        - code [ref=f9e1217]: SessionStart
                        - text: ","
                        - code [ref=f9e1218]: SessionEnd
                        - text: ","
                        - code [ref=f9e1219]: SubagentStart
                        - text: ","
                        - code [ref=f9e1220]: SubagentStop
                        - text: ","
                        - code [ref=f9e1221]: UserPromptSubmit
                        - text: ","
                        - code [ref=f9e1222]: Stop
                        - text: ", or"
                        - code [ref=f9e1223]: Interrupt
                        - text: .
                  - row [ref=f9e1224]:
                    - cell [ref=f9e1225]:
                      - code [ref=f9e1226]: hooks.<Event>[].hooks
                    - cell [ref=f9e1227]:
                      - code [ref=f9e1228]: array<table>
                    - cell "Hook handlers for a matcher group. Command and MCP tool hooks are supported while prompt and agent hook handlers are parsed but skipped." [ref=f9e1229]
                  - row [ref=f9e1231]:
                    - cell [ref=f9e1232]:
                      - code [ref=f9e1233]: hooks.<Event>[].hooks[].additionalContextLimit
                    - cell [ref=f9e1234]:
                      - code [ref=f9e1235]: integer
                    - cell [ref=f9e1236]:
                      - generic [ref=f9e1237]:
                        - text: Approximate per-handler token threshold for saving oversized
                        - code [ref=f9e1238]: additionalContext
                        - text: to disk and showing the model a shorter preview. Defaults to
                        - code [ref=f9e1239]: "2500"
                        - text: ;
                        - code [ref=f9e1240]: "0"
                        - text: passes the full context directly to the model. See
                        - link "Large hook output" [ref=f9e1241] [cursor=pointer]:
                          - /url: /docs/hooks#large-hook-output
                        - text: .
                  - row [ref=f9e1242]:
                    - cell [ref=f9e1243]:
                      - code [ref=f9e1244]: hooks.<Event>[].hooks[].async
                    - cell [ref=f9e1245]:
                      - code [ref=f9e1246]: boolean
                    - cell [ref=f9e1247]:
                      - generic [ref=f9e1248]:
                        - text: Run a command hook in the background without delaying the triggering operation. Defaults to
                        - code [ref=f9e1249]: "false"
                        - text: ;
                        - code [ref=f9e1250]: SessionEnd
                        - text: always runs synchronously. See
                        - link "Run hooks in the background" [ref=f9e1251] [cursor=pointer]:
                          - /url: /docs/hooks#run-hooks-in-the-background
                        - text: .
                  - row [ref=f9e1252]:
                    - cell [ref=f9e1253]:
                      - code [ref=f9e1254]: hooks.<Event>[].hooks[].commandWindows
                    - cell [ref=f9e1255]:
                      - code [ref=f9e1256]: string
                    - cell [ref=f9e1257]:
                      - generic [ref=f9e1258]:
                        - text: Windows-only command override for command hooks. The TOML alias
                        - code [ref=f9e1259]: command_windows
                        - text: is also accepted.
