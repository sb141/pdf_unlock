                    - cell [ref=f9e946]:
                      - code [ref=f9e947]: boolean
                    - cell [ref=f9e948]:
                      - generic [ref=f9e949]:
                        - text: Allow chaining through an upstream proxy from the environment. Defaults to
                        - code [ref=f9e950]: "true"
                        - text: .
                  - row [ref=f9e951]:
                    - cell [ref=f9e952]:
                      - code [ref=f9e953]: features.network_proxy.dangerously_allow_all_unix_sockets
                    - cell [ref=f9e954]:
                      - code [ref=f9e955]: boolean
                    - cell [ref=f9e956]:
                      - generic [ref=f9e957]:
                        - text: Permit arbitrary Unix socket destinations instead of allowlist-only access. Defaults to
                        - code [ref=f9e958]: "false"
                        - text: ; use only in tightly controlled environments.
                  - row [ref=f9e959]:
                    - cell [ref=f9e960]:
                      - code [ref=f9e961]: features.network_proxy.dangerously_allow_non_loopback_proxy
                    - cell [ref=f9e962]:
                      - code [ref=f9e963]: boolean
                    - cell [ref=f9e964]:
                      - generic [ref=f9e965]:
                        - text: Permit non-loopback listener addresses. Defaults to
                        - code [ref=f9e966]: "false"
                        - text: ; enabling it can expose proxy listeners beyond localhost.
                  - row [ref=f9e967]:
                    - cell [ref=f9e968]:
                      - code [ref=f9e969]: features.network_proxy.domains
                    - cell [ref=f9e970]:
                      - code [ref=f9e971]: map<string, allow | deny>
                    - cell [ref=f9e972]:
                      - generic [ref=f9e973]:
                        - text: Domain policy for sandboxed networking. Unset by default, which means no external destinations are allowed until you add
                        - code [ref=f9e974]: allow
                        - text: rules. Supports exact hosts,
                        - code [ref=f9e975]: "*.example.com"
                        - text: for subdomains only,
                        - code [ref=f9e976]: "**.example.com"
                        - text: for apex plus subdomains, and global
                        - code [ref=f9e977]: "*"
                        - text: allow rules. Prefer scoped rules because
                        - code [ref=f9e978]: "*"
                        - text: broadly opens public outbound access. Add
                        - code [ref=f9e979]: deny
                        - text: rules for blocked destinations;
                        - code [ref=f9e980]: deny
                        - text: wins on conflicts.
                  - row [ref=f9e981]:
