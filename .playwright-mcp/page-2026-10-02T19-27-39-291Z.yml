                  - row [ref=f9e3091]:
                    - cell [ref=f9e3092]:
                      - code [ref=f9e3093]: browser_use.origins
                    - cell [ref=f9e3094]:
                      - code [ref=f9e3095]: map<string, table>
                    - cell [ref=f9e3096]:
                      - generic [ref=f9e3097]:
                        - text: Origin-specific Browser Use policies. Keys use
                        - code [ref=f9e3098]: <scheme>://<host-pattern>[:<port>]
                        - text: with
                        - code [ref=f9e3099]: http
                        - text: or
                        - code [ref=f9e3100]: https
                        - text: . Use an exact host,
                        - code [ref=f9e3101]: "*.example.com"
                        - text: for subdomains only, or
                        - code [ref=f9e3102]: "**.example.com"
                        - text: for the base domain and its subdomains. Other
                        - code [ref=f9e3103]: "*"
                        - text: wildcards can span dots, so
                        - code [ref=f9e3104]: region*.example.com
                        - text: also matches
                        - code [ref=f9e3105]: region.api.example.com
                        - text: ; a host of
                        - code [ref=f9e3106]: "*"
                        - text: matches every host for that scheme. Schemes and nondefault ports are significant; explicit default ports are normalized away. Paths, queries, embedded usernames or passwords, and wildcard schemes or ports are invalid. Quote the pattern in TOML, for example
                        - code [ref=f9e3107]: "[browser_use.origins.\"https://**.example.com\"]"
                        - text: .
                  - row [ref=f9e3108]:
                    - cell [ref=f9e3109]:
                      - code [ref=f9e3110]: browser_use.origins.<pattern>
                    - cell [ref=f9e3111]:
                      - code [ref=f9e3112]: table
                    - cell [ref=f9e3113]:
                      - generic [ref=f9e3114]:
                        - text: "Policy for origins matching this pattern. If several patterns match, Codex uses the most restrictive value for each capability:"
                        - code [ref=f9e3115]: deny
                        - text: over
                        - code [ref=f9e3116]: allow
                        - text: ","
                        - code [ref=f9e3117]: "false"
                        - text: over
                        - code [ref=f9e3118]: "true"
                        - text: ", and"
                        - code [ref=f9e3119]: turn
                        - text: over
                        - code [ref=f9e3120]: thread
                        - text: .
                  - row [ref=f9e3121]:
                    - cell [ref=f9e3122]:
                      - code [ref=f9e3123]: browser_use.origins.<pattern>.access
                    - cell [ref=f9e3124]:
                      - code [ref=f9e3125]: allow | deny
                    - cell [ref=f9e3126]:
                      - generic [ref=f9e3127]:
                        - text: Use
                        - code [ref=f9e3128]: deny
                        - text: to block Browser Use on matching origins. Denial also blocks uploads, downloads, full browser debugging access, and automatic review there.
                        - code [ref=f9e3129]: allow
                        - text: only lets normal approval and policy checks continue.
                  - row [ref=f9e3130]:
                    - cell [ref=f9e3131]:
                      - code [ref=f9e3132]: browser_use.origins.<pattern>.access_approval_lifetime
                    - cell [ref=f9e3133]:
