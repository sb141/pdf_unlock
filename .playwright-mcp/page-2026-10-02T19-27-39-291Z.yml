                    - cell [ref=f9e3466]:
                      - code [ref=f9e3467]: experimental_network.unix_sockets
                    - cell [ref=f9e3468]:
                      - code [ref=f9e3469]: map<string, allow | deny>
                    - cell "Administrator-managed Unix socket allowlist for sandboxed networking on macOS. Paths must be absolute." [ref=f9e3470]
                  - row [ref=f9e3472]:
                    - cell [ref=f9e3473]:
                      - code [ref=f9e3474]: experimental_network.unix_sockets.<path>
                    - cell [ref=f9e3475]:
                      - code [ref=f9e3476]: allow | deny
                    - cell [ref=f9e3477]:
                      - generic [ref=f9e3478]:
                        - text: On macOS,
                        - code [ref=f9e3479]: allow
                        - text: adds an absolute Unix socket path to the allowlist;
                        - code [ref=f9e3480]: deny
                        - text: leaves it out. A
                        - code [ref=f9e3481]: deny
                        - text: entry cannot block a socket when allow-all Unix sockets is enabled.
