                  - row [ref=f9e3188]:
                    - cell [ref=f9e3189]:
                      - code [ref=f9e3190]: chatgpt_base_url
                    - cell [ref=f9e3191]:
                      - code [ref=f9e3192]: string
                    - cell "Enforce the ChatGPT service base URL before authentication and cloud-policy retrieval. This doesn't configure every Codex network destination. Set through the local system requirements file or macOS MDM; cloud-managed values are ignored." [ref=f9e3193]
                  - row [ref=f9e3195]:
                    - cell [ref=f9e3196]:
                      - code [ref=f9e3197]: check_for_update_on_startup
                    - cell [ref=f9e3198]:
                      - code [ref=f9e3199]: boolean
                    - cell "Enforce whether Codex checks for updates when it starts." [ref=f9e3200]
                  - row [ref=f9e3202]:
                    - cell [ref=f9e3203]:
                      - code [ref=f9e3204]: cli_auth_credentials_store
                    - cell [ref=f9e3205]:
                      - code [ref=f9e3206]: file | keyring | auto | ephemeral
                    - cell [ref=f9e3207]:
                      - generic [ref=f9e3208]:
                        - text: Enforce the CLI credential store before authentication loads.
                        - code [ref=f9e3209]: file
                        - text: uses
                        - code [ref=f9e3210]: CODEX_HOME/auth.json
                        - text: ;
                        - code [ref=f9e3211]: keyring
                        - text: requires the OS credential store;
                        - code [ref=f9e3212]: auto
                        - text: falls back to a file if the credential store is unavailable;
                        - code [ref=f9e3213]: ephemeral
                        - text: keeps credentials in memory for the current process. Set through the local system requirements file or macOS MDM; cloud-managed values are ignored.
                  - row [ref=f9e3214]:
                    - cell [ref=f9e3215]:
                      - code [ref=f9e3216]: computer_use
                    - cell [ref=f9e3217]:
                      - code [ref=f9e3218]: table
                    - cell [ref=f9e3219]:
                      - generic [ref=f9e3220]:
                        - text: Managed requirements for agent-driven work in native desktop apps. Managed app rules and
                        - code [ref=f9e3221]: config.toml
                        - text: app rules are both enforced; an app must be allowed by each policy source.
                  - row [ref=f9e3222]:
                    - cell [ref=f9e3223]:
                      - code [ref=f9e3224]: computer_use.allow_locked_computer_use
                    - cell [ref=f9e3225]:
                      - code [ref=f9e3226]: boolean
                    - cell [ref=f9e3227]:
                      - generic [ref=f9e3228]:
                        - text: Set to
                        - code [ref=f9e3229]: "false"
                        - text: to prevent users from enabling Locked Use on a managed macOS device. This requirement removes the enablement controls; it does not turn off Locked Use if it is already enabled. If omitted, normal product availability applies.
                  - row [ref=f9e3230]:
                    - cell [ref=f9e3231]:
                      - code [ref=f9e3232]: computer_use.allow_persistent_approval
                    - cell [ref=f9e3233]:
                      - code [ref=f9e3234]: boolean
                    - cell [ref=f9e3235]:
                      - generic [ref=f9e3236]:
                        - text: Set to
                        - code [ref=f9e3237]: "false"
                        - text: to remove the option to save app approvals across sessions. Approvals for the current session remain available. Setting it to
                        - code [ref=f9e3238]: "true"
                        - text: or omitting it does not approve an app.
                  - row [ref=f9e3239]:
                    - cell [ref=f9e3240]:
                      - code [ref=f9e3241]: computer_use.default_app_access
                    - cell [ref=f9e3242]:
                      - code [ref=f9e3243]: allow | deny
                    - cell [ref=f9e3244]:
                      - generic [ref=f9e3245]:
                        - text: Fallback access for native apps that do not match a platform-specific rule.
                        - code [ref=f9e3246]: deny
                        - text: blocks access.
                        - code [ref=f9e3247]: allow
                        - text: only lets normal approval and policy checks continue. The product default is
                        - code [ref=f9e3248]: allow
                        - text: .
                  - row [ref=f9e3249]:
                    - cell [ref=f9e3250]:
                      - code [ref=f9e3251]: computer_use.macos
                    - cell [ref=f9e3252]:
                      - code [ref=f9e3253]: table
                    - cell "Computer Use app rules for macOS." [ref=f9e3254]
                  - row [ref=f9e3256]:
                    - cell [ref=f9e3257]:
                      - code [ref=f9e3258]: computer_use.macos.bundle_ids
                    - cell [ref=f9e3259]:
                      - code [ref=f9e3260]: map<string, allow | deny>
                    - cell [ref=f9e3261]:
                      - generic [ref=f9e3262]:
                        - text: Map exact macOS bundle identifiers to
                        - code [ref=f9e3263]: allow
                        - text: or
                        - code [ref=f9e3264]: deny
                        - text: . A matching rule replaces
                        - code [ref=f9e3265]: computer_use.default_app_access
                        - text: within the same policy source. A deny from either managed requirements or user configuration still blocks access.
                  - row [ref=f9e3266]:
                    - cell [ref=f9e3267]:
                      - code [ref=f9e3268]: computer_use.macos.bundle_ids.<bundle-id>
                    - cell [ref=f9e3269]:
                      - code [ref=f9e3270]: allow | deny
                    - cell [ref=f9e3271]:
                      - generic [ref=f9e3272]:
                        - text: Use
                        - code [ref=f9e3273]: deny
                        - text: to block the exact bundle identifier.
                        - code [ref=f9e3274]: allow
                        - text: overrides only this policy source's default and still requires any other policy source and the normal approval flow to allow the app.
                  - row [ref=f9e3275]:
                    - cell [ref=f9e3276]:
                      - code [ref=f9e3277]: computer_use.windows
                    - cell [ref=f9e3278]:
                      - code [ref=f9e3279]: table
                    - cell "Computer Use app rules for packaged and unpackaged Windows apps." [ref=f9e3280]
                  - row [ref=f9e3282]:
                    - cell [ref=f9e3283]:
                      - code [ref=f9e3284]: computer_use.windows.aumids
                    - cell [ref=f9e3285]:
                      - code [ref=f9e3286]: map<string, allow | deny>
                    - cell [ref=f9e3287]:
                      - generic [ref=f9e3288]:
                        - text: Map exact, registered Application User Model IDs (AUMIDs) for signed packaged apps to
                        - code [ref=f9e3289]: allow
                        - text: or
                        - code [ref=f9e3290]: deny
                        - text: . A matching rule replaces
                        - code [ref=f9e3291]: computer_use.default_app_access
                        - text: within the same policy source.
                  - row [ref=f9e3292]:
                    - cell [ref=f9e3293]:
                      - code [ref=f9e3294]: computer_use.windows.aumids.<aumid>
                    - cell [ref=f9e3295]:
                      - code [ref=f9e3296]: allow | deny
                    - cell [ref=f9e3297]:
                      - generic [ref=f9e3298]:
                        - text: Use
                        - code [ref=f9e3299]: deny
                        - text: to block the exact packaged-app identity.
                        - code [ref=f9e3300]: allow
                        - text: overrides only this policy source's default and still requires any other policy source and the normal approval flow to allow the app.
                  - row [ref=f9e3301]:
                    - cell [ref=f9e3302]:
                      - code [ref=f9e3303]: computer_use.windows.exes
                    - cell [ref=f9e3304]:
                      - code [ref=f9e3305]: array<table>
                    - cell [ref=f9e3306]:
                      - generic [ref=f9e3307]:
                        - text: Rules for signed, unpackaged Windows executables. Rules match the executable's verified publisher and signed version information, not its path or current file name. A matching deny takes precedence over matching allows. Unsigned executables use
                        - code [ref=f9e3308]: computer_use.default_app_access
                        - text: ; executables whose signed identity cannot be verified unambiguously are blocked.
                  - row [ref=f9e3309]:
                    - cell [ref=f9e3310]:
                      - code [ref=f9e3311]: computer_use.windows.exes[].access
                    - cell [ref=f9e3312]:
                      - code [ref=f9e3313]: allow | deny
                    - cell [ref=f9e3314]:
                      - generic [ref=f9e3315]:
                        - text: Required access decision for matching executables.
                        - code [ref=f9e3316]: deny
                        - text: blocks access.
                        - code [ref=f9e3317]: allow
                        - text: overrides only this policy source's default and still requires any other policy source and the normal approval flow to allow the app.
                  - row [ref=f9e3318]:
                    - cell [ref=f9e3319]:
                      - code [ref=f9e3320]: computer_use.windows.exes[].binary_name
                    - cell [ref=f9e3321]:
                      - code [ref=f9e3322]: string
                    - cell [ref=f9e3323]:
                      - generic [ref=f9e3324]:
                        - text: Optional
                        - code [ref=f9e3325]: OriginalFilename
                        - text: from the executable's signed version information. Matching is case-insensitive. If a matching publisher and product rule requires this value but the executable does not provide it, Computer Use blocks the executable.
                  - row [ref=f9e3326]:
                    - cell [ref=f9e3327]:
                      - code [ref=f9e3328]: computer_use.windows.exes[].product_name
                    - cell [ref=f9e3329]:
                      - code [ref=f9e3330]: string
                    - cell [ref=f9e3331]:
                      - generic [ref=f9e3332]:
                        - text: Required exact
                        - code [ref=f9e3333]: ProductName
                        - text: from the executable's signed version information.
                  - row [ref=f9e3334]:
                    - cell [ref=f9e3335]:
                      - code [ref=f9e3336]: computer_use.windows.exes[].publisher_name
                    - cell [ref=f9e3337]:
                      - code [ref=f9e3338]: string
                    - cell "Required exact publisher name from the executable's trusted signing certificate, formatted as a Windows X.500 distinguished name." [ref=f9e3339]
                  - row [ref=f9e3341]:
                    - cell [ref=f9e3342]:
                      - code [ref=f9e3343]: default_permissions
                    - cell [ref=f9e3344]:
                      - code [ref=f9e3345]: string
                    - cell [ref=f9e3346]:
                      - generic [ref=f9e3347]:
                        - text: Managed default permission profile. The profile must be allowed by
                        - code [ref=f9e3348]: allowed_permission_profiles
                        - text: . Set this explicitly for predictable behavior; if omitted, Codex defaults to
                        - code [ref=f9e3349]: :workspace
                        - text: only when both
                        - code [ref=f9e3350]: :workspace
                        - text: and
                        - code [ref=f9e3351]: :read-only
                        - text: are explicitly allowed.
                  - row [ref=f9e3352]:
                    - cell [ref=f9e3353]:
                      - code [ref=f9e3354]: enforce_residency
                    - cell [ref=f9e3355]:
                      - code [ref=f9e3356]: string
                    - cell [ref=f9e3357]:
                      - generic [ref=f9e3358]:
                        - text: Require Codex service traffic to use a supported data residency. Currently accepts
                        - code [ref=f9e3359]: us
                        - text: .
                  - row [ref=f9e3360]:
                    - cell [ref=f9e3361]:
                      - code [ref=f9e3362]: experimental_network
                    - cell [ref=f9e3363]:
                      - code [ref=f9e3364]: table
                    - cell [ref=f9e3365]:
                      - generic [ref=f9e3366]:
                        - text: Administrator-managed network requirements for sandboxed local commands, enforced from
                        - code [ref=f9e3367]: requirements.toml
                        - text: . When enabled, these requirements can start the command network proxy without
                        - code [ref=f9e3368]: features.network_proxy
                        - text: . Browser tools separately check managed network denies and exclusive allowlists. These requirements do not route browser traffic through the proxy or control web search, apps, MCP servers, native-app traffic, or other capability-specific traffic. On supported managed Codex Cloud paths, these requirements constrain command networking alongside separate Cloud environment internet settings. Approved full sandbox escalation can bypass the command proxy where policy permits it. Work Cloud does not inherit these requirements.
                  - row [ref=f9e3369]:
                    - cell [ref=f9e3370]:
                      - code [ref=f9e3371]: experimental_network.allow_local_binding
                    - cell [ref=f9e3372]:
                      - code [ref=f9e3373]: boolean
                    - cell "Permit broader local/private-network access for sandboxed networking. On the supported Codex Cloud proxy path, an explicit false can prevent upstream-proxy access even if a domain is allowed. It defaults to true only if no applicable requirement, selected network profile, or proxy feature setting provides a value. Inherited false remains explicit. A supported higher-priority Cloud override can change it without broadening Global for Local or adding domain Allow entries. Verify executor support. Do not apply this Cloud default to Local." [ref=f9e3374]
                  - row [ref=f9e3376]:
                    - cell [ref=f9e3377]:
                      - code [ref=f9e3378]: experimental_network.allow_upstream_proxy
                    - cell [ref=f9e3379]:
                      - code [ref=f9e3380]: boolean
                    - cell "Allow sandboxed networking to chain through an upstream proxy from the environment." [ref=f9e3381]
                  - row [ref=f9e3383]:
                    - cell [ref=f9e3384]:
                      - code [ref=f9e3385]: experimental_network.allowed_domains
                    - cell [ref=f9e3386]:
                      - code [ref=f9e3387]: array<string>
                    - cell [ref=f9e3388]:
                      - generic [ref=f9e3389]:
                        - text: Administrator allow rules for sandboxed-command networking while the managed network proxy is enabled. These rules do not apply to web search, apps, or MCP servers. Do not combine this with
                        - code [ref=f9e3390]: experimental_network.domains
                        - text: .
                  - row [ref=f9e3391]:
                    - cell [ref=f9e3392]:
                      - code [ref=f9e3393]: experimental_network.dangerously_allow_all_unix_sockets
                    - cell [ref=f9e3394]:
                      - code [ref=f9e3395]: boolean
                    - cell "Permit arbitrary Unix socket destinations instead of allowlist-only access. Use only in tightly controlled environments." [ref=f9e3396]
                  - row [ref=f9e3398]:
                    - cell [ref=f9e3399]:
                      - code [ref=f9e3400]: experimental_network.dangerously_allow_non_loopback_proxy
                    - cell [ref=f9e3401]:
                      - code [ref=f9e3402]: boolean
                    - cell [ref=f9e3403]:
                      - generic [ref=f9e3404]:
                        - text: Permit non-loopback listener addresses for
                        - code [ref=f9e3405]: "[experimental_network]"
                        - text: requirements. Enabling it can expose listeners beyond localhost.
                  - row [ref=f9e3406]:
                    - cell [ref=f9e3407]:
                      - code [ref=f9e3408]: experimental_network.denied_domains
                    - cell [ref=f9e3409]:
                      - code [ref=f9e3410]: array<string>
                    - cell [ref=f9e3411]:
                      - generic [ref=f9e3412]:
                        - text: List-shaped administrator deny rules for sandboxed networking. Do not combine this with
                        - code [ref=f9e3413]: experimental_network.domains
                        - text: .
                  - row [ref=f9e3414]:
                    - cell [ref=f9e3415]:
                      - code [ref=f9e3416]: experimental_network.domains
                    - cell [ref=f9e3417]:
                      - code [ref=f9e3418]: map<string, allow | deny>
                    - cell [ref=f9e3419]:
                      - generic [ref=f9e3420]:
                        - text: Map-shaped administrator domain policy for sandboxed networking. Supports exact hosts,
                        - code [ref=f9e3421]: "*.example.com"
                        - text: for subdomains only,
                        - code [ref=f9e3422]: "**.example.com"
                        - text: for apex plus subdomains, and global
                        - code [ref=f9e3423]: "*"
                        - text: allow rules. Prefer scoped rules because
                        - code [ref=f9e3424]: "*"
                        - text: broadly opens public outbound access. Environment rules can replace the same Global domain key within a policy. Higher-priority values replace the same key, while other inherited keys remain. After composition, a different matching
                        - code [ref=f9e3425]: deny
                        - text: ", including an inherited wildcard, still blocks a request. Empty environment maps do not clear Global rules. Verify executor support. Do not combine this with"
                        - code [ref=f9e3426]: experimental_network.allowed_domains
                        - text: or
                        - code [ref=f9e3427]: experimental_network.denied_domains
                        - text: .
                  - row [ref=f9e3428]:
                    - cell [ref=f9e3429]:
                      - code [ref=f9e3430]: experimental_network.domains.<pattern>
                    - cell [ref=f9e3431]:
                      - code [ref=f9e3432]: allow | deny
                    - cell "Allow or deny sandboxed network access for the matching domain pattern. A deny rule wins when several patterns match." [ref=f9e3433]
                  - row [ref=f9e3435]:
                    - cell [ref=f9e3436]:
                      - code [ref=f9e3437]: experimental_network.enabled
                    - cell [ref=f9e3438]:
                      - code [ref=f9e3439]: boolean
                    - cell "Enable sandboxed networking requirements. This does not grant network access when the active sandbox keeps command networking off." [ref=f9e3440]
                  - row [ref=f9e3442]:
                    - cell [ref=f9e3443]:
                      - code [ref=f9e3444]: experimental_network.http_port
                    - cell [ref=f9e3445]:
                      - code [ref=f9e3446]: integer
                    - cell [ref=f9e3447]:
                      - generic [ref=f9e3448]:
                        - text: Loopback HTTP listener port to use for
                        - code [ref=f9e3449]: "[experimental_network]"
                        - text: requirements.
                  - row [ref=f9e3450]:
                    - cell [ref=f9e3451]:
                      - code [ref=f9e3452]: experimental_network.managed_allowed_domains_only
                    - cell [ref=f9e3453]:
                      - code [ref=f9e3454]: boolean
                    - cell "When networking requirements are enabled and this is true, ordinary user configuration and per-domain approvals cannot expand the managed proxy allowlist. With no effective configured or inherited Allow entries, ordinary managed commands have no allowed destinations. A deny-only policy does not allow the rest of the internet. This does not cover every tool or approved full sandbox escalation." [ref=f9e3455]
                  - row [ref=f9e3457]:
                    - cell [ref=f9e3458]:
                      - code [ref=f9e3459]: experimental_network.socks_port
