                      - code [ref=f9e3461]: integer
                    - cell [ref=f9e3462]:
                      - generic [ref=f9e3463]:
                        - text: Loopback SOCKS5 listener port to use for
                        - code [ref=f9e3464]: "[experimental_network]"
                        - text: requirements.
