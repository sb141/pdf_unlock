          - heading "Configuration Reference" [level=1] [ref=f9e141]
          - paragraph [ref=f9e142]: Complete reference for Codex config.toml and requirements.toml
          - button "Copy Page" [ref=f9e146] [cursor=pointer]
        - article [ref=f9e151]:
          - paragraph [ref=f9e152]:
            - text: Use this page as a searchable reference for Codex configuration files. For conceptual guidance and examples, start with
            - link "Config basics" [ref=f9e153] [cursor=pointer]:
              - /url: /docs/config-file/config-basic
            - text: and
            - link "Advanced Config" [ref=f9e154] [cursor=pointer]:
              - /url: /docs/config-file/config-advanced
            - text: .
          - heading "Settings for Local computer access with Work Cloud Copy link to Settings for Local computer access with Work Cloud" [level=2] [ref=f9e155]:
            - generic [ref=f9e156]: Settings for Local computer access with Work Cloud
            - button "Copy link to Settings for Local computer access with Work Cloud" [ref=f9e157] [cursor=pointer]
          - paragraph [ref=f9e160]: With Local computer access with Work Cloud enabled, OpenAI’s cloud coordinates the task while supported tools run in the cloud or on a connected computer. Requirements set limits; configuration values provide defaults.
          - paragraph [ref=f9e161]:
            - text: Use the policy API to manage Global settings. To manage Local or Codex Cloud settings, use the Agent Security UI. Existing Global API workflows remain available after migration. Test your scripts and Terraform integrations, and confirm that policy assignments and ordering are unchanged. Support for a
            - code [ref=f9e162]: requirements.toml
            - text: field does not by itself establish API compatibility.
          - table [ref=f9e164]:
            - rowgroup [ref=f9e165]:
              - row [ref=f9e166]:
                - columnheader "Setting or setting family" [ref=f9e167]
                - columnheader "Scope in Local computer access with Work Cloud" [ref=f9e168]
                - columnheader "Guidance" [ref=f9e169]
            - rowgroup [ref=f9e170]:
              - row [ref=f9e171]:
                - cell "Approval policies and review requirements" [ref=f9e172]
                - cell "Global orchestrator policy when managed policy is enabled" [ref=f9e173]
                - cell "Keep approval and review controls in Global. Environment overrides cannot change orchestrator controls. Local execution and cloud-container execution have separate policy scopes." [ref=f9e174]
              - row [ref=f9e175]:
                - cell "Managed apps, MCP servers, plugins, marketplaces, and command rules" [ref=f9e176]
                - cell "Global policy" [ref=f9e177]
                - cell "Keep these controls global. Do not treat the field’s presence in a schema as proof that the field can be edited per environment." [ref=f9e178]
              - row [ref=f9e179]:
                - cell "File, sandbox, and portable network requirements" [ref=f9e180]
                - cell "Local execution" [ref=f9e181]
                - cell [ref=f9e182]:
                  - text: For local execution, MDM and legacy managed-device requirements rank above Agent Security. The device’s system requirements file ranks below Agent Security. The new enterprise
                  - code [ref=f9e183]: requirements.toml
                  - text: configuration does not apply to Work cloud containers, which retain existing Work Cloud policies.
              - row [ref=f9e184]:
                - cell "Platform-specific executor controls" [ref=f9e185]
                - cell "Computer running the step" [ref=f9e186]
                - cell "Support depends on the executor and platform." [ref=f9e187]
              - row [ref=f9e188]:
                - cell "Managed hooks" [ref=f9e189]
                - cell "Where enabled, admin-defined MCP hooks that run on the cloud coordinator (orchestrator) for supported lifecycle and tool events." [ref=f9e190]
                - cell "Before relying on these hooks, test the callback connection, confirm the events it receives, and check how failures affect the task. MCP hooks do not provide a complete Compliance API audit trail. Command, local-config, and plugin hooks are unsupported with cloud orchestration, even when tools execute locally. Existing supported hooks still apply to local-only Work and Codex threads where orchestration and execution are both local." [ref=f9e191]
              - row [ref=f9e192]:
                - cell "Proxy listener addresses, ports, and process settings" [ref=f9e193]
                - cell "Not portable environment policy" [ref=f9e194]
                - cell "Managed HTTP/SOCKS listener ports and non-loopback proxy listeners are unsupported by the cloud runtime; socket-rule support depends on the execution path. Custom proxy configuration is separate from supported destination restrictions." [ref=f9e195]
              - row [ref=f9e196]:
                - cell "App-only settings and ordinary local defaults" [ref=f9e197]
                - cell "Not necessarily consumed by cloud coordination" [ref=f9e198]
                - cell "App-enforced controls can remain effective even when Local computer access with Work Cloud does not consume them. Cloud delivery and cloud-browser behavior need separate validation." [ref=f9e199]
          - heading "Agent Security requirements for Local computer access with Work Cloud Copy link to Agent Security requirements for Local computer access with Work Cloud" [level=3] [ref=f9e200]:
            - generic [ref=f9e201]: Agent Security requirements for Local computer access with Work Cloud
            - button "Copy link to Agent Security requirements for Local computer access with Work Cloud" [ref=f9e202] [cursor=pointer]
          - paragraph [ref=f9e205]: For Work with local access and dots, supported Global policy applies to the shared cloud orchestrator when managed policy is enabled. Local execution requirements govern the connected computer. Work cloud containers and dots cloud computers use their own execution configuration and requirements. Test local and cloud controls separately.
          - heading "Exposed in the Agent Security UI Copy link to Exposed in the Agent Security UI" [level=4] [ref=f9e206]:
            - generic [ref=f9e207]: Exposed in the Agent Security UI
            - button "Copy link to Exposed in the Agent Security UI" [ref=f9e208] [cursor=pointer]
          - list [ref=f9e211]:
            - listitem [ref=f9e212]: Allowed approval policies
            - listitem [ref=f9e213]: Allowed web search modes
          - heading "Configured through TOML Copy link to Configured through TOML" [level=4] [ref=f9e214]:
            - generic [ref=f9e215]: Configured through TOML
            - button "Copy link to Configured through TOML" [ref=f9e216] [cursor=pointer]
          - list [ref=f9e219]:
            - listitem [ref=f9e220]:
              - code [ref=f9e221]: allowed_approvals_reviewers
            - listitem [ref=f9e222]:
              - code [ref=f9e223]: auto_review
            - listitem [ref=f9e224]:
              - code [ref=f9e225]: guardian_policy_config
            - listitem [ref=f9e226]:
              - code [ref=f9e227]: apps
            - listitem [ref=f9e228]:
              - code [ref=f9e229]: mcp_servers
            - listitem [ref=f9e230]:
              - code [ref=f9e231]: plugins
            - listitem [ref=f9e232]:
              - code [ref=f9e233]: rules
          - paragraph [ref=f9e234]: These orchestrator requirements stay in Global. They do not configure shared cloud capability permissions or make local execution settings portable to Work cloud containers or dots cloud computers.
          - heading "Local computer access with Work Cloud compatibility limits Copy link to Local computer access with Work Cloud compatibility limits" [level=3] [ref=f9e235]:
            - generic [ref=f9e236]: Local computer access with Work Cloud compatibility limits
            - button "Copy link to Local computer access with Work Cloud compatibility limits" [ref=f9e237] [cursor=pointer]
          - paragraph [ref=f9e240]: Support depends on the field, how the policy is delivered, and where the task runs. Check the member’s effective policy before enabling sync. Some controls need to be tested in your deployment, as noted in the table.
          - paragraph [ref=f9e241]: Within a policy, the order from highest to lowest is OS-specific environment override → all-OS environment override → Global. A higher-priority policy wins even when a lower-priority policy is more specific.
          - paragraph [ref=f9e242]:
            - text: For local execution, MDM and legacy managed-device requirements take precedence over Agent Security, which takes precedence over the device’s system requirements file. Some requirements, including network requirements, have field-specific merge rules and runtime limits. See
            - link "Managed configuration" [ref=f9e243] [cursor=pointer]:
              - /url: /docs/enterprise/managed-configuration
            - text: for examples.
          - table [ref=f9e245]:
            - rowgroup [ref=f9e246]:
              - row [ref=f9e247]:
                - columnheader [ref=f9e248]:
                  - strong [ref=f9e249]: Setting or family
                - columnheader [ref=f9e250]:
                  - strong [ref=f9e251]: Local computer access with Work Cloud compatibility
                - columnheader [ref=f9e252]:
                  - strong [ref=f9e253]: Admin guidance
            - rowgroup [ref=f9e254]:
              - row [ref=f9e255]:
                - cell [ref=f9e256]:
                  - code [ref=f9e257]: sqlite_home
                  - text: ","
                  - code [ref=f9e258]: log_dir
                  - text: ","
                  - code [ref=f9e259]: model_catalog_json
                - cell "Not supported as managed cloud overrides." [ref=f9e260]
                - cell "Local paths cannot move cloud storage or logs. A local model catalog does not carry over." [ref=f9e261]
              - row [ref=f9e262]:
                - cell [ref=f9e263]:
                  - code [ref=f9e264]: model_provider
                  - text: ","
                  - code [ref=f9e265]: model_providers
                - cell "Not supported in managed Local computer access with Work Cloud requirements or configuration." [ref=f9e266]
                - cell "Custom inference gateways and provider connections do not carry over through these fields. This is separate from model selection." [ref=f9e267]
              - row [ref=f9e268]:
                - cell [ref=f9e269]:
                  - code [ref=f9e270]: enforce_residency
                - cell "Blocks Local computer access with Work Cloud when enabled in any cloud policy." [ref=f9e271]
                - cell [ref=f9e272]:
                  - text: If
                  - code [ref=f9e273]: enforce_residency
                  - text: is enabled in any cloud policy,
                  - strong [ref=f9e274]: Allow local computer access
                  - text: is disabled for both Work and dots. This safeguard does not configure workspace residency or, by itself, disable Work Cloud or dots.
              - row [ref=f9e275]:
                - cell [ref=f9e276]:
                  - code [ref=f9e277]: application.network.enabled
                  - text: and
                  - code [ref=f9e278]: application.network.domains
                - cell "Not supported by Local computer access with Work Cloud." [ref=f9e279]
                - cell "Do not use these application-destination restrictions as Local computer access with Work Cloud command-networking controls." [ref=f9e280]
              - row [ref=f9e281]:
                - cell [ref=f9e282]:
                  - code [ref=f9e283]: allow_browser_and_computer_use
                  - text: ","
                  - code [ref=f9e284]: in_app_browser
                  - text: ","
                  - code [ref=f9e285]: additional_developer_instructions
                - cell "Cloud policy delivery needs validation. Local computer access with Work Cloud rejects these managed requirement keys." [ref=f9e286]
                - cell [ref=f9e287]:
                  - text: Browser restrictions have app-side checks. That does not prove cloud delivery or cloud-browser enforcement.
                  - code [ref=f9e288]: additional_developer_instructions
                  - text: requires orchestrator support.
              - row [ref=f9e289]:
                - cell [ref=f9e290]:
                  - code [ref=f9e291]: experimental_network
                  - text: and
                  - code [ref=f9e292]: permissions.<profile>.network
                - cell "Partial. Supported destination and executor restrictions differ from custom proxy configuration." [ref=f9e293]
                - cell "Managed HTTP/SOCKS listener ports and non-loopback proxy listeners are unsupported by the cloud runtime; socket-rule support depends on the execution path. Local-execution merge behavior is separate. Command-network restrictions do not disable hosted search, MCP, or app tools." [ref=f9e294]
              - row [ref=f9e295]:
                - cell [ref=f9e296]:
                  - text: features /
                  - code [ref=f9e297]: feature_requirements
                  - text: ", models,"
                  - code [ref=f9e298]: computer_use
                - cell "Partial." [ref=f9e299]
                - cell [ref=f9e300]:
                  - text: Retired switches such as
