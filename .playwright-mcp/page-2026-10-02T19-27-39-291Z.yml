                      - code [ref=f9e2110]: permissions.<name>.filesystem
                    - cell [ref=f9e2111]:
                      - code [ref=f9e2112]: table
                    - cell [ref=f9e2113]:
                      - generic [ref=f9e2114]:
                        - text: Named filesystem permission profile. Each key is an absolute path or special token such as
                        - code [ref=f9e2115]: :minimal
                        - text: or
                        - code [ref=f9e2116]: :workspace_roots
                        - text: .
                  - row [ref=f9e2117]:
                    - cell [ref=f9e2118]:
                      - code [ref=f9e2119]: permissions.<name>.filesystem.":workspace_roots".<subpath-or-glob>
                    - cell [ref=f9e2120]:
                      - code [ref=f9e2121]: "\"read\" | \"write\" | \"deny\""
                    - cell [ref=f9e2122]:
                      - generic [ref=f9e2123]:
                        - text: Scoped filesystem access relative to each effective workspace root. Use
                        - code [ref=f9e2124]: "\".\""
                        - text: for the root itself; glob subpaths such as
                        - code [ref=f9e2125]: "\"**/*.env\""
                        - text: can deny reads with
                        - code [ref=f9e2126]: "\"deny\""
                        - text: .
                  - row [ref=f9e2127]:
                    - cell [ref=f9e2128]:
                      - code [ref=f9e2129]: permissions.<name>.filesystem.<path-or-glob>
                    - cell [ref=f9e2130]:
                      - code [ref=f9e2131]: "\"read\" | \"write\" | \"deny\" | table"
                    - cell [ref=f9e2132]:
                      - generic [ref=f9e2133]:
                        - text: Grant direct access for a path, glob pattern, or special token, or scope nested entries under that root. Use
                        - code [ref=f9e2134]: "\"deny\""
                        - text: to deny reads for matching paths.
                  - row [ref=f9e2135]:
