                        - code [ref=f9e3137]: turn
                        - text: limits it to the current turn, and
                        - code [ref=f9e3138]: thread
                        - text: keeps it for the rest of the current thread.
                        - code [ref=f9e3139]: persistent_approval
                        - text: separately controls whether
                        - code [ref=f9e3140]: Always allow
                        - text: is available.
                  - row [ref=f9e3141]:
