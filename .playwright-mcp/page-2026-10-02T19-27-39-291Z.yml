                  - text: ", marketplace source restrictions"
                - cell "The app or app-server enforces these controls on some policy delivery paths." [ref=f9e310]
                - cell "App controls can still apply when Local computer access with Work Cloud ignores a field. Desktop browser site rules do not apply to Work cloud containers. Validate the actual surface and policy delivery path." [ref=f9e311]
          - paragraph [ref=f9e312]:
            - text: The configuration schema includes keys that may not work with Local computer access with Work Cloud or support environment overrides. See
            - link "Managed configuration" [ref=f9e313] [cursor=pointer]:
