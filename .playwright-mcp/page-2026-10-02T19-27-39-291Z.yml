                        - text: .
                  - row [ref=f9e3694]:
                    - cell [ref=f9e3695]:
                      - code [ref=f9e3696]: hooks.<Event>
                    - cell [ref=f9e3697]:
                      - code [ref=f9e3698]: array<table>
                    - cell [ref=f9e3699]:
                      - generic [ref=f9e3700]:
                        - text: Matcher groups for a hook event such as
                        - code [ref=f9e3701]: PreToolUse
                        - text: ","
                        - code [ref=f9e3702]: PermissionRequest
                        - text: ","
                        - code [ref=f9e3703]: PostToolUse
                        - text: ","
                        - code [ref=f9e3704]: PreCompact
                        - text: ","
                        - code [ref=f9e3705]: PostCompact
                        - text: ","
                        - code [ref=f9e3706]: SessionStart
                        - text: ","
                        - code [ref=f9e3707]: SessionEnd
                        - text: ","
                        - code [ref=f9e3708]: SubagentStart
                        - text: ","
                        - code [ref=f9e3709]: SubagentStop
                        - text: ","
                        - code [ref=f9e3710]: UserPromptSubmit
                        - text: ", or"
                        - code [ref=f9e3711]: Stop
                        - text: .
                  - row [ref=f9e3712]:
                    - cell [ref=f9e3713]:
                      - code [ref=f9e3714]: hooks.<Event>[].hooks
                    - cell [ref=f9e3715]:
                      - code [ref=f9e3716]: array<table>
                    - cell "Hook handlers for a matcher group. Command and MCP tool hooks are supported while prompt and agent hook handlers are parsed but skipped." [ref=f9e3717]
                  - row [ref=f9e3719]:
                    - cell [ref=f9e3720]:
                      - code [ref=f9e3721]: hooks.<Event>[].hooks[].additionalContextLimit
                    - cell [ref=f9e3722]:
                      - code [ref=f9e3723]: integer
                    - cell [ref=f9e3724]:
                      - generic [ref=f9e3725]:
                        - text: Approximate per-handler token threshold for saving oversized
                        - code [ref=f9e3726]: additionalContext
                        - text: to disk and showing the model a shorter preview. Defaults to
                        - code [ref=f9e3727]: "2500"
                        - text: ;
                        - code [ref=f9e3728]: "0"
                        - text: passes the full context directly to the model. See
                        - link "Large hook output" [ref=f9e3729] [cursor=pointer]:
                          - /url: /docs/hooks#large-hook-output
                        - text: .
                  - row [ref=f9e3730]:
                    - cell [ref=f9e3731]:
                      - code [ref=f9e3732]: hooks.<Event>[].hooks[].async
                    - cell [ref=f9e3733]:
                      - code [ref=f9e3734]: boolean
                    - cell [ref=f9e3735]:
                      - generic [ref=f9e3736]:
                        - text: Run a command hook in the background without delaying the triggering operation. Defaults to
                        - code [ref=f9e3737]: "false"
                        - text: ;
                        - code [ref=f9e3738]: SessionEnd
                        - text: always runs synchronously. See
                        - link "Run hooks in the background" [ref=f9e3739] [cursor=pointer]:
                          - /url: /docs/hooks#run-hooks-in-the-background
                        - text: .
