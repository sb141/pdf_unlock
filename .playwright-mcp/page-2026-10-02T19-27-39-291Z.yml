                  - text: = false,
                  - code [ref=f9e302]: tool_search_always_defer_mcp_tools
                  - text: = false,
                  - code [ref=f9e303]: js_repl
                  - text: = true, and
                  - code [ref=f9e304]: remote_control
                  - text: = true are rejected. Some computer-use settings still need end-to-end validation.
              - row [ref=f9e305]:
