                      - code [ref=f9e3027]: turn | thread
                    - cell [ref=f9e3028]:
                      - generic [ref=f9e3029]:
                        - text: "Set how long a non-persistent site-access approval lasts:"
                        - code [ref=f9e3030]: turn
                        - text: limits it to the current turn, and
                        - code [ref=f9e3031]: thread
                        - text: keeps it for the rest of the current thread.
                        - code [ref=f9e3032]: persistent_approval
                        - text: separately controls whether
                        - code [ref=f9e3033]: Always allow
                        - text: is available. The product default is
                        - code [ref=f9e3034]: thread
                        - text: .
                  - row [ref=f9e3035]:
                    - cell [ref=f9e3036]:
                      - code [ref=f9e3037]: browser_use.default_origin_policy.auto_review
                    - cell [ref=f9e3038]:
                      - code [ref=f9e3039]: allow | deny
