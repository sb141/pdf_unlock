                      - generic [ref=f9e3041]:
                        - text: Use
                        - code [ref=f9e3042]: deny
                        - text: to skip automatic review on origins that use the fallback and ask the user for approval instead.
                        - code [ref=f9e3043]: allow
                        - text: leaves automatic review available when other settings allow it.
                  - row [ref=f9e3044]:
                    - cell [ref=f9e3045]:
                      - code [ref=f9e3046]: browser_use.default_origin_policy.downloads
