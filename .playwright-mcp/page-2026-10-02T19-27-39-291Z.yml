                      - code [ref=f9e3143]: browser_use.origins.<pattern>.auto_review
                    - cell [ref=f9e3144]:
                      - code [ref=f9e3145]: allow | deny
                    - cell [ref=f9e3146]:
                      - generic [ref=f9e3147]:
                        - text: Use
                        - code [ref=f9e3148]: deny
                        - text: to skip automatic review on matching origins and ask the user for approval instead.
                        - code [ref=f9e3149]: allow
                        - text: leaves automatic review available when other settings allow it.
                  - row [ref=f9e3150]:
                    - cell [ref=f9e3151]:
                      - code [ref=f9e3152]: browser_use.origins.<pattern>.downloads
                    - cell [ref=f9e3153]:
                      - code [ref=f9e3154]: allow | deny
                    - cell [ref=f9e3155]:
                      - generic [ref=f9e3156]:
                        - text: Use
                        - code [ref=f9e3157]: deny
                        - text: to block Browser Use downloads on matching origins.
                        - code [ref=f9e3158]: allow
                        - text: only lets normal approval and policy checks continue.
                  - row [ref=f9e3159]:
