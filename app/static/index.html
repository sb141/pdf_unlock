<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Unlock</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #0f766e;
      --danger: #b91c1c;
      --muted: #6b7280;
      --border: #d1d5db;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #dbeafe, var(--bg));
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .row {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="password"], input[type="text"], input[type="file"], button {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }

    .password-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-container input {
      width: 100%;
      padding-right: 40px;
      box-sizing: border-box;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: none !important;
      color: var(--muted) !important;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      box-shadow: none;
    }

    .toggle-password-btn:hover {
      color: var(--text) !important;
    }

    .toggle-password-btn:focus {
      outline: none;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin: 8px 0;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .success { background: #dcfce7; color: #166534; }
    .failed { background: #fee2e2; color: #991b1b; }

    .batch {
      margin-top: 12px;
      display: none;
    }

    .btn-secondary {
      background: #e5e7eb !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
    }

    .btn-secondary:hover {
      background: #d1d5db !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>PDF Unlock</h1>
    <p>Upload locked PDFs and provide the password to generate unlocked copies.</p>

    <form id="unlock-form">
      <div class="row">
        <label for="password">Password</label>
        <div class="password-container">
          <input id="password" name="password" type="password" required />
          <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
              <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="row">
        <label for="files">PDF files</label>
        <input id="files" name="files" type="file" accept="application/pdf,.pdf" multiple required />
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button id="submit-btn" type="submit">Unlock PDFs</button>
        <button id="clear-btn" type="button" class="btn-secondary" style="display: none;">Start Over / Clear All</button>
      </div>
      <div class="status" id="status"></div>
      <div class="error" id="error"></div>
    </form>

    <a id="batch-link" class="batch" href="#">Download batch ZIP</a>

    <table id="results-table" style="display:none;">
      <thead>
        <tr>
          <th>File</th>
          <th>Status</th>
          <th>Error</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </main>

  <script>
    const form = document.getElementById("unlock-form");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const resultsTable = document.getElementById("results-table");
    const resultsBody = document.getElementById("results-body");
    const batchLink = document.getElementById("batch-link");
    const submitBtn = document.getElementById("submit-btn");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("toggle-password");
    const clearBtn = document.getElementById("clear-btn");

    clearBtn.addEventListener("click", () => {
      form.reset();
      passwordInput.setAttribute("type", "password");
      togglePasswordBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;
      statusEl.textContent = "";
      errorEl.textContent = "";
      resultsTable.style.display = "none";
      resultsBody.innerHTML = "";
      batchLink.style.display = "none";
      clearBtn.style.display = "none";
    });

    togglePasswordBtn.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      if (type === "password") {
        togglePasswordBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        `;
      } else {
        togglePasswordBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" x2="22" y1="2" y2="22"/>
          </svg>
        `;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "Processing...";
      errorEl.textContent = "";
      resultsTable.style.display = "none";
      resultsBody.innerHTML = "";
      batchLink.style.display = "none";
      submitBtn.disabled = true;
      clearBtn.style.display = "none";

      try {
        const formData = new FormData(form);
        const response = await fetch("/api/unlock", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const detail = await response.json().catch(() => ({ detail: "Request failed" }));
          throw new Error(detail.detail || "Request failed");
        }

        const payload = await response.json();
        statusEl.textContent = `Done: ${payload.summary.succeeded} succeeded, ${payload.summary.failed} failed.`;

        payload.results.forEach((result) => {
          const row = document.createElement("tr");
          const downloadCell = result.download_token
            ? `<a href="/api/download/${payload.request_id}/${result.download_token}">Download</a>`
            : "-";

          row.innerHTML = `
            <td>${result.original_name}</td>
            <td><span class="pill ${result.status}">${result.status}</span></td>
            <td>${result.error_code || "-"}</td>
            <td>${downloadCell}</td>
          `;
          resultsBody.appendChild(row);
        });

        resultsTable.style.display = "table";

        if (payload.batch_download_available) {
          batchLink.href = `/api/download-batch/${payload.request_id}`;
          batchLink.style.display = "inline-block";
        }
      } catch (error) {
        statusEl.textContent = "";
        errorEl.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
        clearBtn.style.display = "inline-block";
      }
    });
  </script>
</body>
</html>
